# Lenovmail — authored by satuapps
# Fake mail server used by the end-to-end tests:
#   docker compose -f docker-compose.test.yml up -d
# Port 8081 exposes the GreenMail API; 8080 belongs to the Lenovmail API on the host.
services:
  greenmail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "3025:3025"   # SMTP
      - "3143:3143"   # IMAP
      - "3993:3993"   # IMAPS
      - "3465:3465"   # SMTPS
      - "8081:8080"   # GreenMail API

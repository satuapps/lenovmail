# Lenovmail — authored by satuapps
name: Feature request
description: Propose a change or addition to Lenovmail.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and where does it hurt (CLI, REST API, MCP, GUI)?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What would change. If it touches the REST API, MCP tools, config
        (`src/lenovmail/config.py`), or the schema (`migrations/`), say so explicitly.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, links, or examples from other mail systems.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been requested.
          required: true
